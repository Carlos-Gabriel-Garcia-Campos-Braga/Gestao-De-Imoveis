name: gestao_imoveis
description: App de gestão de imóveis para proprietários e administradoras.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0
  retrofit: ^4.4.1

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  material_symbols_icons: ^4.2823.3

  # Utils
  intl: ^0.20.2
  connectivity_plus: ^6.0.5
  path_provider: ^2.1.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  riverpod_generator: ^2.6.4
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  build_runner: ^2.4.13
  # retrofit_generator adicionado na Fase 2 quando datasources forem criados

dependency_overrides:
  analyzer_plugin: ^0.13.0

flutter:
  uses-material-design: true
